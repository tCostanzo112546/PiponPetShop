<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipon - Admin Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            background-color: #f9f9f9;
            padding: 20px;
            font-family: 'Varela Round', sans-serif;
        }

        .nav-admin {
            max-width: 800px;
            margin: 0 auto 20px auto;
        }

        .btn-volver {
            text-decoration: none;
            color: #333;
            font-weight: bold;
            padding: 10px;
            border: 2px solid black;
            background: white;
        }

        .admin-box {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px;
            border: 3px solid black;
            background-color: white;
            box-shadow: 10px 10px 0px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        input,
        select {
            padding: 10px;
            border: 2px solid black;
            margin-top: 5px;
        }

        /* Estilo para la fila de marca + botón */
        .marca-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .btn-plus {
            background: #4CAF50;
            color: white;
            border: 2px solid black;
            padding: 10px 15px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }

        button {
            background: #BE448E;
            color: white;
            padding: 15px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        button:hover {
            background: #9B3674;
        }

        #mensaje-estado {
            margin-top: 20px;
            font-weight: bold;
        }

        /* Lista de productos */
        .lista-admin {
            margin-top: 40px;
            border-top: 3px solid black;
            padding-top: 20px;
        }

        .item-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border: 2px solid black;
            margin-bottom: 10px;
            background: white;
        }

        .btn-editar {
            background: #4CAF50;
            padding: 8px 12px;
            font-size: 0.8rem;
        }

        .btn-borrar {
            background: #f44336;
            padding: 8px 12px;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>

    <div class="nav-admin">
        <a href="index.html" class="btn-volver">⬅️ Volver a la Tienda</a>
    </div>

    <div class="admin-box">
        <h2 id="titulo-form">AGREGAR PRODUCTO</h2>

        <form id="admin-form">
            <input type="hidden" id="adm-id">

            <div class="form-group">
                <label>Marca / Categoría:</label>
                <div class="marca-row">
                    <select id="adm-marca" style="flex: 1;" required>
                        <option value="">Cargando marcas...</option>
                    </select>
                    <button type="button" class="btn-plus" onclick="nuevaMarca()">+ Nueva</button>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label>Nombre del Producto:</label>
                    <input type="text" id="adm-nombre" placeholder="Ej: Adulto Medium" required>
                </div>
                <div class="form-group">
                    <label>Precio por Kg:</label>
                    <input type="number" id="adm-precio" placeholder="Ej: 4500" required>
                </div>
            </div>

            <div class="form-group">
                <label>URL de la Imagen:</label>
                <input type="url" id="adm-imagen" placeholder="https://..." required>
            </div>

            <div style="display: flex; gap: 10px;">
                <button type="submit" id="btn-guardar" style="flex: 2;">GUARDAR EN LA WEB</button>
                <button type="button" id="btn-cancelar" onclick="cancelarEdicion()"
                    style="flex: 1; display:none; background:#666;">CANCELAR</button>
            </div>
        </form>

        <div id="mensaje-estado"></div>

        <div class="lista-admin">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="margin:0;">Productos Actuales</h3>
                <input type="text" id="busqueda-admin" placeholder="🔍 Buscar..." style="width: 200px; margin:0;">
            </div>
            <div id="contenedor-lista"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://mrikmyjtsntyldadgzdy.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_NVb4WypHphuj7E_1TnYWYw_W90jjm7Q';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const form = document.getElementById('admin-form');
        const selectMarca = document.getElementById('adm-marca');
        const contenedorLista = document.getElementById('contenedor-lista');

        // --- 1. CARGAR MARCAS DESDE SUPABASE ---
        async function cargarMarcas() {
            try {
                const { data, error } = await _supabase.from('marcas').select('*').order('nombre');
                if (error) throw error;

                selectMarca.innerHTML = '<option value="">Seleccionar marca...</option>';
                data.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.nombre;
                    opt.textContent = m.nombre;
                    selectMarca.appendChild(opt);
                });
            } catch (err) {
                console.error("Error cargando marcas:", err);
            }
        }

        // --- 2. AGREGAR NUEVA MARCA ---
        async function nuevaMarca() {
            const nombre = prompt("Nombre de la nueva marca o categoría (Ej: Juguetes, Royal Canin, Huesos):");
            if (nombre) {
                const { error } = await _supabase.from('marcas').insert([{ nombre: nombre.toUpperCase() }]);
                if (error) alert("Error: " + error.message);
                else cargarMarcas(); // Recarga el combo
            }
        }

        // --- 3. CARGAR PRODUCTOS ---
        async function cargarLista() {
            const { data } = await _supabase.from('productos').select('*').order('id', { ascending: false });
            contenedorLista.innerHTML = '';
            data.forEach(p => {
                const div = document.createElement('div');
                div.className = 'item-admin';
                div.innerHTML = `
                    <div class="item-info"><strong>${p.marca}</strong> - ${p.nombre} ($${p.precio})</div>
                    <div class="item-acciones">
                        <button class="btn-editar" onclick="prepararEdicion('${p.id}','${p.marca}','${p.nombre}',${p.precio},'${p.imagen}')">Editar</button>
                        <button class="btn-borrar" onclick="borrarProducto('${p.id}')">Borrar</button>
                    </div>`;
                contenedorLista.appendChild(div);
            });
        }

        // --- 4. GUARDAR PRODUCTO ---
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('adm-id').value;
            const datos = {
                marca: selectMarca.value,
                nombre: document.getElementById('adm-nombre').value,
                precio: parseInt(document.getElementById('adm-precio').value),
                imagen: document.getElementById('adm-imagen').value
            };

            const { error } = id
                ? await _supabase.from('productos').update(datos).eq('id', id)
                : await _supabase.from('productos').insert([datos]);

            if (error) alert("Error: " + error.message);
            else {
                document.getElementById('mensaje-estado').textContent = "✅ ¡Guardado!";
                cancelarEdicion();
                cargarLista();
            }
        });

        function prepararEdicion(id, marca, nombre, precio, imagen) {
            document.getElementById('adm-id').value = id;
            selectMarca.value = marca;
            document.getElementById('adm-nombre').value = nombre;
            document.getElementById('adm-precio').value = precio;
            document.getElementById('adm-imagen').value = imagen;
            document.getElementById('titulo-form').textContent = "EDITAR PRODUCTO";
            document.getElementById('btn-cancelar').style.display = "block";
        }

        function cancelarEdicion() {
            form.reset();
            document.getElementById('adm-id').value = '';
            document.getElementById('titulo-form').textContent = "AGREGAR PRODUCTO";
            document.getElementById('btn-cancelar').style.display = "none";
        }

        async function borrarProducto(id) {
            if (confirm("¿Borrar?")) {
                await _supabase.from('productos').delete().eq('id', id);
                cargarLista();
            }
        }

        // Inicio
        cargarMarcas();
        cargarLista();
    </script>
</body>

</html>
