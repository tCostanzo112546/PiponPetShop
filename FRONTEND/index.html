<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipon Pet Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&family=Varela+Round&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>


    <header class="main-header-cartel">
        <div class="cartel-content">
            <div class="menu-toggle" id="mobile-menu">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="logo-container">
                <div class="logo-row">

                    <img src="img/huellitas.png" alt="Huellitas decorativas" class="paw-decor paw-left">

                    <img src="img/logoPipon2.png" alt="Pipon Pet Shop Logo" class="main-logo-img">

                    <img src="img/huellitas.png" alt="Huellitas decorativas" class="paw-decor paw-right">

                </div>
            </div>
        </div>
    </header>

    <main class="container">

        <section class="local-gallery">
            <div class="gallery-item">
                <img src="img/foto1localHD.jpeg" alt="Local Pipon Alimentos">
                <div class="gallery-overlay">Variedad en Alimentos</div>
            </div>
            <div class="gallery-item">
                <img src="img/foto2localHD.jpeg" alt="Local Pipon Accesorios">
                <div class="gallery-overlay">Accesorios, juguetes y mas!</div>
            </div>
        </section>

        <section class="search-container">
            <div class="search-box">
                <input type="text" placeholder="Buscar productos (ej: Royal Canin, Pro Plan...)" id="product-search">
                <button type="submit">
                    <span class="search-icon">🔍</span>
                </button>
            </div>
        </section>

        <section class="productos-section">
            <div class="productos-header">
                <div class="filtros-marca" id="filtros-marca"></div>
            </div>
            <div id="contenedor-productos">
                <div class="skeleton-grid">
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                </div>
            </div>
            <p id="sin-resultados" class="sin-resultados" hidden>No encontramos productos que coincidan con tu búsqueda
                🐾</p>
        </section>

        <div id="lightbox" class="lightbox" hidden>
            <button type="button" class="lightbox-cerrar" id="lightbox-cerrar" aria-label="Cerrar">✕</button>
            <div class="lightbox-contenido">
                <img src="" alt="" id="lightbox-img">
                <p id="lightbox-nombre" class="lightbox-nombre"></p>
                <p id="lightbox-precio" class="lightbox-precio"></p>
            </div>
        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
